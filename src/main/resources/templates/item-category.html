<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Whiteowl - Itens', ~{::section})}">

<section>
    <div class="max-w-7xl mx-auto px-4 py-10">

        <div th:replace="~{layout/breadcrumbs :: breadcrumb(${breadcrumbs})}"></div>

        <div class="mb-8">
            <div class="flex items-center gap-4 mb-2">
                <img th:src="@{'/images/items/categories/' + ${category.getKey()} + '.png'}"
                     th:alt="${category}"
                     class="w-10 h-10 md:w-20 md:h-20 object-contain">

                <h1 class="text-3xl md:text-5xl text-gold"
                    th:text="${category.getLabel()}">
                    Armaduras
                </h1>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(items)}"
             class="bg-card border border-gray-800 rounded-2xl p-8 text-center text-gray-400">
            Nenhum item encontrado.
        </div>

        <div th:unless="${#lists.isEmpty(items)}"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <a th:each="item : ${items}"
               href="#"
               class="block bg-card border border-gray-800 rounded-2xl p-5 hover-glow arcane-glow transition">

                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <img th:src="@{${item}}"
                             alt="a"
                             class="w-22 h-20 object-contain shrink-0">

                        <h2 class="text-xl text-gold" th:text="${item.name()}">
                            Flecha
                        </h2>
                    </div>
                </div>

                <p class="text-sm text-gray-400 line-clamp-3" th:text="${item.description()}">
                    Flecha de madeira e ferro...
                </p>

                <div th:if="${item.weapon != null}"
                     class="mt-4 rounded-lg border border-gray-800/80 bg-black/20 p-3 text-xs text-gray-300 space-y-2">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-gold font-semibold">Arma</span>
                        <span th:if="${item.weapon.simple}" class="px-2 py-0.5 rounded border border-gray-700">Simples</span>
                        <span th:if="${item.weapon.martial}" class="px-2 py-0.5 rounded border border-gray-700">Marcial</span>
                        <span th:if="${item.weapon.improvised}" class="px-2 py-0.5 rounded border border-gray-700">Improvisada</span>
                    </div>

                    <div class="flex flex-wrap items-center gap-3 text-gray-400">
                        <span th:if="${item.weapon.damageDice != null and !#strings.isEmpty(item.weapon.damageDice)}">
                            Dano:
                            <span class="text-white" th:text="${item.weapon.damageDice}"></span>
                        </span>
                        <span th:if="${item.weapon.damage != null and item.weapon.damage.name != null and !#strings.isEmpty(item.weapon.damage.name)}">
                            Tipo:
                            <span class="text-white" th:text="${item.weapon.damage.name}"></span>
                        </span>
                    </div>

                    <div th:if="${!#lists.isEmpty(item.weapon.properties)}" class="text-gray-400">
                        Propriedades:
                        <span th:each="prop, iter : ${item.weapon.properties}">
                            <span class="text-white" th:text="${prop.property != null ? prop.property.name : ''}"></span>
                            <span th:if="${prop.detail != null and !#strings.isEmpty(prop.detail)}"
                                  class="text-gray-300"
                                  th:text="${' (' + prop.detail + ')'}"></span><span th:if="${!iter.last}">, </span>
                        </span>
                    </div>
                </div>

                <div class="text-sm text-gray-500 mb-3 pt-3 flex items-center justify-between">
                    <span th:if="${item.weight != null}" class="flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             class="w-4 h-4 text-gray-400">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M8 7h8M6 7h12l2 11H4L6 7zm3-3h6l1 3H8l1-3z"/>
                        </svg>
                        <span th:text="${item.weight + ' ' + item.weightUnit}"></span>
                    </span>

                    <span th:if="${item.cost != null}" class="flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             class="w-4 h-4 text-yellow-500">
                            <circle cx="12" cy="12" r="8" stroke-linecap="round" stroke-linejoin="round"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 12H14.5M12 9.5v5"/>
                        </svg>
                        <span th:text="${item.cost + ' PO'}"></span>
                    </span>
                </div>
            </a>

        </div>
    </div>
</section>
