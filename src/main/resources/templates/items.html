<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Whiteowl - Itens', ~{::section})}">


<section>
    <div class="max-w-7xl mx-auto px-4 py-10">

        <div th:replace="~{layout/breadcrumbs :: breadcrumb(${breadcrumbs})}"></div>

        <div class="mb-8">
            <div class="flex items-center gap-4 mb-2">
                <img th:src="@{/images/icons/items.png}"
                     alt="Ícone de antecedentes"
                     class="w-10 h-10 md:w-20 md:h-20 object-contain">

                <h1 class="text-3xl md:text-5xl text-gold">
                    Itens
                </h1>
            </div>

            <p class="text-gray-400">
                Explore equipamentos, armas, armaduras, veículos e outros itens
                disponíveis para suas aventuras.
            </p>
        </div>

        <div th:if="${#lists.isEmpty(categories)}"
             class="bg-card border border-gray-800 rounded-2xl p-8 text-center text-gray-400">
            Nenhuma categoria encontrada.
        </div>

        <div th:unless="${#lists.isEmpty(categories)}"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <a th:each="category : ${categories}"
               th:href="@{/items/category/{category}(category=${category.name().toLowerCase()})}"
               class="block bg-card border border-gray-800 rounded-2xl p-5 hover-glow arcane-glow transition">

                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <img th:src="@{'/images/items/categories/' + ${category.slug()} + '.png'}"
                             th:alt="${category.label}"
                             class="w-22 h-20 object-contain shrink-0">

                        <h2 class="text-xl text-gold" th:text="${category.label}">
                            Armadura
                        </h2>
                    </div>
                </div>
            </a>

        </div>
    </div>



</section>
