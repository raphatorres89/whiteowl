<th:block th:fragment="dice-roller">
    <!-- Dice Roller -->
    <div id="dice-roller" class="fixed bottom-6 right-6 z-50">

        <div id="dice-menu"
            class="flex items-center gap-2">

            <!-- Dice options -->
            <div id="dice-options"
                class="flex items-center gap-2
                    opacity-0 pointer-events-none
                    translate-x-4
                    transition-all duration-300">

               <button type="button"
                       class="dice-button"
                       data-dice="4"
                       title="Rolar d4">

                   <img th:src="@{/images/dices/d4.png}"
                        alt="d4">
               </button>

               <button type="button"
                       class="dice-button"
                       data-dice="6"
                       title="Rolar d6">

                   <img th:src="@{/images/dices/d6.png}"
                        alt="d6">
               </button>

               <button type="button"
                       class="dice-button"
                       data-dice="10"
                       title="Rolar d10">

                   <img th:src="@{/images/dices/d10.png}"
                        alt="d10">
               </button>

               <button type="button"
                       class="dice-button"
                       data-dice="20"
                       title="Rolar d20">

                   <img th:src="@{/images/dices/d20.png}"
                        alt="d20">
               </button>

               <button type="button"
                       class="dice-button"
                       data-dice="100"
                       title="Rolar d100">

                   <img th:src="@{/images/dices/d100.png}"
                        alt="d100">
               </button>

            </div>

            <!-- Main dice button -->
            <button id="dice-toggle"
                   type="button"
                   title="Abrir dados"
                   class="dice-toggle">

               <img th:src="@{/images/dices/d20.png}"
                    alt="Dados">

            </button>

        </div>
    </div>

    <!-- Dice Result Modal -->
    <div id="dice-result"
         class="fixed inset-0 z-[60]
            flex items-center justify-center
            bg-black/60
            opacity-0 pointer-events-none
            transition-opacity duration-200">

        <div id="dice-result-card"
            class="bg-card border border-gray-800
                rounded-2xl p-8
                min-w-[260px]
                text-center
                shadow-2xl
                scale-95
                transition-transform duration-200">

            <p class="text-sm text-gray-500 uppercase tracking-widest">
               Resultado
            </p>

            <div id="dice-result-text"
                class="mt-4 text-4xl text-gold">
               d20 → 20
            </div>

        </div>
    </div>
</th:block>
