<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Whiteowl - Perícias', ~{::section})}">

<section>
    <div class="max-w-7xl mx-auto px-4 py-10">

        <div th:replace="~{layout/breadcrumbs :: breadcrumb(${breadcrumbs})}"></div>

        <div class="mb-8">

            <div class="flex items-center gap-4 mb-2">

                <img th:src="@{/images/icons/skills.png}"
                     alt="Ícone de perícias"
                     class="w-10 h-10 md:w-20 md:h-20 object-contain">

                <h1 class="text-3xl md:text-5xl text-gold">
                    Perícias
                </h1>

            </div>

            <p class="text-gray-400">
                Conhecimentos e habilidades utilizados pelos personagens para superar desafios.
            </p>

        </div>

        <div th:if="${#lists.isEmpty(skills)}"
             class="bg-card border border-gray-800 rounded-2xl p-8 text-center text-gray-400">
            Nenhuma perícia encontrada.
        </div>

        <div th:unless="${#lists.isEmpty(skills)}" class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <article th:each="skill : ${skills}"
                     class="bg-card border border-gray-800 rounded-2xl p-5 hover-glow arcane-glow transition">

                <div class="flex items-start gap-5">

                    <div class="w-32 h-32 rounded-xl border border-gray-800 bg-black/20 p-3 shrink-0">
                        <img th:src="@{'/images/skills/' + ${skill.slug} + '.png'}"
                             th:alt="${skill.name}"
                             class="w-full h-full object-contain">
                    </div>

                    <div class="min-w-0">
                        <div class="flex items-start justify-between gap-3">
                            <h2 class="text-xl text-gold"
                                th:text="${skill.name}">
                                Acrobacia
                            </h2>

                            <span class="text-xs text-gray-500 uppercase tracking-wider shrink-0"
                                  th:text="${skill.ability}">
                                Destreza
                            </span>
                        </div>

                        <p class="text-sm text-gray-400 leading-6 mt-3"
                           th:text="${skill.description}">
                            Sua capacidade de permanecer de pé em uma situação difícil.
                        </p>
                    </div>
                </div>

            </article>

        </div>

    </div>
</section>

</html>
